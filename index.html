<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Watch % — YT Progress</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap');

  :root{
    --bg: #16121f;
    --bg-2: #1e1830;
    --panel: #211a33;
    --line: #352a4d;
    --ink: #ece6f7;
    --ink-dim: #9084b0;
    --accent: #b98cff;
    --accent-2: #5ee0c0;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, #2a1f42 0%, transparent 45%),
      var(--bg);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 40px;
  }

  header{
    width: 100%;
    max-width: 480px;
    margin-bottom: 18px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    margin: 0 0 2px;
  }

  .sub{
    font-size: 0.72rem;
    color: var(--ink-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .card{
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .url-row{
    display: flex;
    gap: 8px;
  }

  input[type="text"]{
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    padding: 11px 12px;
    border-radius: 9px;
    outline: none;
    min-width: 0;
  }
  input[type="text"]:focus{ border-color: var(--accent); }
  input[type="text"]::placeholder{ color: #5c527a; }

  button{
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    letter-spacing: 0.03em;
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    background: var(--accent);
    color: #1a1228;
    font-weight: 500;
    cursor: pointer;
  }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity: 0.4; }

  .player-wrap{
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: none;
  }
  .player-wrap.active{ display: block; }

  #player-box{
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  #player-box iframe{ width: 100%; height: 100%; display: block; border: 0; }

  .readout{
    padding: 18px 16px 20px;
  }

  .pct-row{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .pct-num{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.6rem;
    line-height: 1;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .pct-num span{ font-size: 1.3rem; color: var(--ink-dim); font-family: 'DM Mono', monospace; font-weight: 400; }

  .time-str{
    font-size: 0.78rem;
    color: var(--ink-dim);
    text-align: right;
  }
  .time-str b{ color: var(--ink); font-weight: 500; }

  .bar-track{
    width: 100%;
    height: 6px;
    background: var(--bg-2);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 1px solid var(--line);
  }
  .bar-fill{
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    transition: width 0.2s linear;
  }

  .status-row{
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
  }

  .dot{
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink-dim);
    margin-right: 6px;
    vertical-align: middle;
  }
  .dot.playing{ background: var(--accent-2); }

  .empty-note{
    font-size: 0.78rem;
    color: var(--ink-dim);
    line-height: 1.5;
    margin-top: 4px;
  }

  .error-msg{
    color: #ff9e9e;
    font-size: 0.78rem;
    margin-top: 10px;
    display: none;
  }
  .error-msg.show{ display: block; }
</style>
</head>
<body>

<header>
  <h1>Watch %</h1>
  <div class="sub">Paste a link · read the number</div>
</header>

<div class="card">
  <div class="url-row">
    <input type="text" id="urlInput" placeholder="Paste YouTube URL…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="loadBtn">Load</button>
  </div>
  <div class="error-msg" id="errorMsg">Couldn't read that link. Try a full youtube.com or youtu.be URL.</div>
  <div class="empty-note" id="emptyNote">Works with any public video link — full URL, youtu.be, or Shorts.</div>
</div>

<div class="player-wrap" id="playerWrap">
  <div id="player-box"><div id="player"></div></div>
  <div class="readout">
    <div class="pct-row">
      <div class="pct-num" id="pctNum">0<span>.0%</span></div>
      <div class="time-str" id="timeStr"><b>0:00</b> / 0:00</div>
    </div>
    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
    <div class="status-row">
      <span><span class="dot" id="statusDot"></span><span id="statusText">idle</span></span>
      <span id="rateText"></span>
    </div>
  </div>
</div>

<script>
  let player = null;
  let apiReady = false;
  let tickHandle = null;
  let pendingVideoId = null;

  function extractVideoId(raw){
    try{
      const url = new URL(raw.trim());
      const host = url.hostname.replace('www.', '');

      if(host === 'youtu.be'){
        return url.pathname.slice(1).split('/')[0] || null;
      }
      if(host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com'){
        if(url.pathname === '/watch'){
          return url.searchParams.get('v');
        }
        if(url.pathname.startsWith('/shorts/')){
          return url.pathname.split('/')[2] || null;
        }
        if(url.pathname.startsWith('/embed/')){
          return url.pathname.split('/')[2] || null;
        }
        if(url.pathname.startsWith('/live/')){
          return url.pathname.split('/')[2] || null;
        }
      }
      return null;
    }catch(e){
      return null;
    }
  }

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function onYouTubeIframeAPIReady(){
    apiReady = true;
    if(pendingVideoId){
      createPlayer(pendingVideoId);
      pendingVideoId = null;
    }
  }
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

  function createPlayer(videoId){
    document.getElementById('playerWrap').classList.add('active');

    if(player){
      player.loadVideoById(videoId);
      return;
    }

    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: function(){ startTick(); },
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(e){
    const dot = document.getElementById('statusDot');
    const text = document.getElementById('statusText');

    if(e.data === YT.PlayerState.PLAYING){
      dot.classList.add('playing');
      text.textContent = 'playing';
    } else if(e.data === YT.PlayerState.PAUSED){
      dot.classList.remove('playing');
      text.textContent = 'paused';
    } else if(e.data === YT.PlayerState.ENDED){
      dot.classList.remove('playing');
      text.textContent = 'ended';
    } else if(e.data === YT.PlayerState.BUFFERING){
      text.textContent = 'buffering';
    }
  }

  function startTick(){
    if(tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(updateReadout, 200);
    updateReadout();
  }

  function updateReadout(){
    if(!player || typeof player.getCurrentTime !== 'function') return;

    let current, duration;
    try{
      current = player.getCurrentTime();
      duration = player.getDuration();
    }catch(e){ return; }

    if(!duration || duration <= 0) return;

    const pct = Math.min(100, (current / duration) * 100);
    const whole = Math.floor(pct);
    const decimal = Math.floor((pct - whole) * 10);

    document.getElementById('pctNum').innerHTML = whole + '<span>.' + decimal + '%</span>';
    document.getElementById('timeStr').innerHTML = '<b>' + fmtTime(current) + '</b> / ' + fmtTime(duration);
    document.getElementById('barFill').style.width = pct + '%';

    try{
      const rate = player.getPlaybackRate();
      document.getElementById('rateText').textContent = rate !== 1 ? rate + 'x' : '';
    }catch(e){}
  }

  function loadVideo(){
    const raw = document.getElementById('urlInput').value;
    const errorMsg = document.getElementById('errorMsg');
    const emptyNote = document.getElementById('emptyNote');

    if(!raw.trim()){
      return;
    }

    const videoId = extractVideoId(raw);

    if(!videoId){
      errorMsg.classList.add('show');
      emptyNote.style.display = 'none';
      return;
    }

    errorMsg.classList.remove('show');

    if(apiReady){
      createPlayer(videoId);
    }else{
      pendingVideoId = videoId;
      // load the IFrame API script on first use
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.body.appendChild(tag);
    }
  }

  document.getElementById('loadBtn').addEventListener('click', loadVideo);
  document.getElementById('urlInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') loadVideo();
  });
</script>

</body>
</html>
